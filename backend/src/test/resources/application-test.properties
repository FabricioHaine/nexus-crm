# ==============================================================================
# Configuracao usada pelos testes de integracao
# ==============================================================================
spring.datasource.url=jdbc:h2:mem:nexus-crm-test;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

app.demo.habilitado=false

# Administrador criado automaticamente nos testes (excluido da limpeza entre casos).
app.auth.admin.email=admin@teste.local
app.auth.admin.senha=Senha@123
app.auth.admin.nome=Admin de Teste

logging.level.org.hibernate.SQL=OFF
