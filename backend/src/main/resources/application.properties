# ==============================================================================
# Nexus CRM - configuracoes comuns da aplicacao
# ==============================================================================
spring.application.name=nexus-crm-backend
server.port=${SERVER_PORT:8080}

# Perfil utilizado quando nenhum outro for informado na execucao.
spring.profiles.default=dev

# Enderecos do front-end Angular autorizados a chamar a API (separados por virgula).
app.cors.origins=http://localhost:4200,http://127.0.0.1:4200

# Associações JPA sao resolvidas dentro da camada de servico (sem lazy loading na serializacao).
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Flyway: o esquema e criado por migrations versionadas.
# O placeholder {vendor} seleciona os scripts especificos do banco em uso.
spring.flyway.locations=classpath:db/migration/{vendor}
spring.flyway.baseline-on-migrate=true

# Documentacao OpenAPI / Swagger UI
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=alpha
springdoc.swagger-ui.tags-sorter=alpha
springdoc.api-docs.path=/v3/api-docs

# ==============================================================================
# Autenticacao - token JWT (HMAC-SHA256)
# ==============================================================================
# A chave abaixo e de DESENVOLVIMENTO. Em producao, defina APP_JWT_SECRET com
# um valor aleatorio de no minimo 32 caracteres.
app.jwt.secret=${APP_JWT_SECRET:nexus-crm-chave-de-desenvolvimento-troque-em-producao-2026}
app.jwt.expiracao-minutos=${APP_JWT_EXPIRACAO_MINUTOS:480}

# ==============================================================================
# Usuario administrador inicial
# ==============================================================================
# Criado apenas na primeira execucao (idempotente). Troque a senha padrao.
app.auth.admin.email=${APP_ADMIN_EMAIL:admin@nexuscrm.local}
app.auth.admin.senha=${APP_ADMIN_SENHA:Nexus@2026}
app.auth.admin.nome=${APP_ADMIN_NOME:Administrador}
