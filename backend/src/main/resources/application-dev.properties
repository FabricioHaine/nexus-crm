# ==============================================================================
# Perfil de desenvolvimento - banco H2 em arquivo local
# O arquivo fica em ./data/nexusdb.mv.db (pasta ignorada pelo Git)
# ==============================================================================
spring.datasource.url=jdbc:h2:file:./data/nexusdb;AUTO_SERVER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=validate

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

logging.level.com.nexus.crm=INFO
