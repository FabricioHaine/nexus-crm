# ==============================================================================
# Perfil PostgreSQL - configuracao persistente de desenvolvimento/producao
#
# Credenciais NAO ficam no repositorio: informe as variaveis de ambiente abaixo
# antes de iniciar a aplicacao com este perfil.
#
#   DB_URL, DB_USERNAME, DB_PASSWORD
#
# Criacao do banco (uma unica vez):
#   CREATE DATABASE nexus_crm;
# ==============================================================================
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/nexus_crm}
spring.datasource.username=${DB_USERNAME:nexus}
spring.datasource.password=${DB_PASSWORD:nexus}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate

logging.level.com.nexus.crm=INFO
