# =============================================================================
# Nexus CRM - servidor da interface web
# =============================================================================

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Compressao dos assets estaticos.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Os arquivos com hash no nome podem ser cacheados para sempre.
    location ~* \.(?:css|js|woff2?|png|jpg|jpeg|gif|svg|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # O index nunca e cacheado: e ele que aponta para o bundle atual.
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    # Rotas do Angular sao resolvidas no cliente.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cabecalhos de seguranca basicos.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
